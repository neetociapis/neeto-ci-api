version: v1.0
fail_fast: true
plan: standard-2

paths:
  - api/**
  - api-reference-v1/**
  - assets/**
  - bundled/**
  - bundled-v1/**
  - cli/**
  - cli-reference/**
  - docs/**
  - docs-v1/**
  - schemas/**
  - scripts/**
  - snippets/**
  - docs.json
  - theme.css
  - os-detect.js
  - package.json
  - yarn.lock
  - .yarnrc.yml
  - .neetoci/verify.yml
  - .neetoci/scripts/*

commands:
  - checkout
  - neetoci-version node 22.13
  - cache restore
  - corepack enable
  - yarn install --immutable
  - cache store
  - yarn build
  - bash .neetoci/scripts/check_links.sh
  - bash .neetoci/scripts/validate_bundled.sh

triggers:
  - event: pull_request
